"$schema" = 'https://starship.rs/config-schema.json'

format = "$all"
right_format = """$time"""

# [username]

# [hostname]

[shlvl]
disabled = true
symbol = " "

[kubernetes]
disabled = true

[directory]
format = "[╭╴](bold cyan) [$path]($style) [$read_only]($read_only_style)"
read_only = " 󰌾"
truncate_to_repo = false
truncation_length = 2
truncation_symbol = ".../"

[vcsh]
disabled = true

[git_branch]
symbol = " "

# [git_commit]

# [git_state]

# [git_status]

[hg_branch]
disabled = true
symbol = " "

[docker_context]
symbol = " "

[package]
symbol = " "

[cmake]
disabled = true

[dart]
disabled = true
symbol = " "

