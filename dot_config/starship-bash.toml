disabled = true

[vagrant]
disabled = true

[zig]
disabled = true

[nix_shell]
disabled = true
symbol = " "

[conda]
disabled = true
symbol = " "

[memory_usage]
disabled = true
symbol = "󰍛 "

[aws]
format = "with [$symbol AWS](bold dimmed yellow) "
symbol = "󰸏"

[gcloud]
disabled = true

[openstack]
disabled = true

[env_var.AWS_PROFILE]
format = "with [$symbol AWS_PROFILE $env_value](bold dimmed yellow) "
symbol = "󰸏"
variable = "AWS_PROFILE"

[env_var.GH_TOKEN]
format = "with [$symbol GH_TOKEN](bold dimmed yellow) "
symbol = ""
variable = "GH_TOKEN"

[env_var.GITHUB_TOKEN]
format = "with [$symbol GITHUB_TOKEN](bold dimmed yellow) "
symbol = ""
variable = "GITHUB_TOKEN"

[env_var.DENO_DEPLOY_TOKEN]
format = "with [$symbol DENO_DEPLOY_TOKEN](bold dimmed yellow) "
symbol = "🦕"
variable = "DENO_DEPLOY_TOKEN"

[env_var.NPM_TOKEN]
format = "with [$symbol NPM_TOKEN](bold dimmed yellow) "
symbol = ""
variable = "NPM_TOKEN"

[env_var.VERCEL_TOKEN]
format = "with [$symbol VERCEL_TOKEN](bold dimmed yellow) "
symbol = "▲"
variable = "VERCEL_TOKEN"

[env_var.FLY_ACCESS_TOKEN]
format = "with [$symbol FLY_ACCESS_TOKEN](bold dimmed yellow) "
symbol = ""
variable = "FLY_ACCESS_TOKEN"

[env_var.SUPABASE_ACCESS_TOKEN]
format = "with [$symbol SUPABASE_ACCESS_TOKEN](bold dimmed yellow) "
symbol = ""
variable = "SUPABASE_ACCESS_TOKEN"

[env_var.TURSO_API_TOKEN]
format = "with [$symbol TURSO_API_TOKEN](bold dimmed yellow) "
symbol = ""
variable = "TURSO_API_TOKEN"

[env_var.ASCIINEMA_REC]
format = "[$symbol rec](bold dimmed red) "
symbol = "󰑋"
variable = "ASCIINEMA_REC"

[env_var.FRP_TOKEN]
format = "[$symbol FRP_TOKEN](bold dimmed yellow) "
symbol = "󱠾"
variable = "FRP_TOKEN"

[env_var.MEMFAULT_API_KEY]
format = "[$symbol MEMFAULT_API_KEY](bold yellow) "
symbol = "󱠾"
variable = "MEMFAULT_API_KEY"

[env_var.FDS_WS]
variable = "FDS_WS"
symbol = "󰇂"
format = "[$symbol $env_value](italic green)"

[container]
disabled = true

[crystal]
disabled = true

[cmd_duration]
min_time = 5_000

# [line_break]

[lua]
disabled = true

[jobs]
disabled = true

[battery]
disabled = true

[time]
disabled = false
format = '[$time]($style)'
style = 'dimmed cyan'
time_format = "%r"

# [status]

# [shell]

[character]
error_symbol = "[╰╴](bold cyan) [✗](bold red)"
success_symbol = "[╰╴](bold cyan) [λ](bold green)"
